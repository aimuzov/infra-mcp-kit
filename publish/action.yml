name: MCP server publish
description: Build the release tag of an MCP server and publish it to npm with provenance.

inputs:
  ref:
    description: Release tag to publish, e.g. v1.2.0.
    required: true
  npm-token:
    description: "npm token with publish rights. Empty uses npm trusted publishing, which needs 'id-token: write' on the job."
    required: false
    default: ''

runs:
  using: composite
  steps:
    - uses: actions/checkout@v5
      with:
        ref: ${{ inputs.ref }}
    - uses: actions/setup-node@v5
      with:
        node-version-file: package.json
        cache: npm
        registry-url: https://registry.npmjs.org
    - shell: bash
      run: npm ci
    # Сборку делает `prepack` или `prepare` пакета, provenance связывает его
    # с этим прогоном и коммитом. Пустой NODE_AUTH_TOKEN не задаём вовсе:
    # с ним npm пошёл бы с пустым токеном вместо trusted publishing.
    - shell: bash
      env:
        TOKEN: ${{ inputs.npm-token }}
      run: |
        if [[ -n "$TOKEN" ]]; then export NODE_AUTH_TOKEN="$TOKEN"; fi
        npm publish --provenance --access public
