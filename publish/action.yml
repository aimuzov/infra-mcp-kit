name: MCP server publish
description: Build the release tag of an MCP server and publish it to npm with provenance.

inputs:
  ref:
    description: Release tag to publish, e.g. v1.2.0.
    required: true
  npm-token:
    description: "npm token with publish rights. Empty uses npm trusted publishing, which needs 'id-token: write' on the job."
    required: false
    default: ''

runs:
  using: composite
  steps:
    - uses: actions/checkout@v5
      with:
        ref: ${{ inputs.ref }}
    - uses: actions/setup-node@v5
      with:
        node-version-file: package.json
        cache: npm
        registry-url: https://registry.npmjs.org
    - shell: bash
      run: npm ci
    # `prepack` собирает пакет, provenance связывает его с этим прогоном и коммитом.
    - shell: bash
      env:
        NODE_AUTH_TOKEN: ${{ inputs.npm-token }}
      run: npm publish --provenance --access public
