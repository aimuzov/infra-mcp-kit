name: MCP server check
description: Install dependencies, then run the formatter, linter, type check, tests and build of an MCP server, install its packed tarball the way npx does and start it, and optionally build its Docker image.

inputs:
  apt-packages:
    description: Space-separated Ubuntu packages the tests or the build need, e.g. ffmpeg.
    required: false
    default: ''
  smoke:
    description: Command that starts the built server from the repository and exits. Empty skips it.
    required: false
    default: node build/index.js --help
  installed-smoke:
    description: Command run in an empty directory where the packed tarball is installed without dev dependencies, as npx would. `auto` runs the first bin with --help. Empty skips the install.
    required: false
    default: auto
  docker:
    description: Dockerfile to build, e.g. deploy/Dockerfile. The image then runs `node build/index.js --help`. Empty skips it.
    required: false
    default: ''
  coverage-lines:
    description: Minimum line coverage in percent, e.g. 95. Runs the `test` script with Node's test coverage; the script must start with `node`. Empty runs the tests without coverage.
    required: false
    default: ''
  astro-tsconfig:
    description: tsconfig for `astro check` and `svelte-check`, e.g. tsconfig.astro.json, when the root one is for the server. Empty uses the root one.
    required: false
    default: ''
  ui:
    description: Run `npm run test:ui` in Chromium after the build, with the browser cached by the Playwright version.
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-node@v5
      with:
        node-version-file: package.json
        cache: npm
    # NOTE: `$PACKAGES` без кавычек намеренно, список через пробел
    # должен разбиться на отдельные аргументы.
    - if: inputs.apt-packages != ''
      shell: bash
      env:
        PACKAGES: ${{ inputs.apt-packages }}
      run: sudo apt-get update && sudo apt-get install -y --no-install-recommends $PACKAGES
    - shell: bash
      run: npm ci
    - shell: bash
      run: npm run format:check
    - shell: bash
      run: npm run lint
    - shell: bash
      run: npm run typecheck
    # Страницы на Astro из `@aimuzov/infra-mcp-kit/astro` есть не у всех серверов:
    # у stdio-коннекторов их нет, и шаг ничего не делает.
    - shell: bash
      env:
        TSCONFIG: ${{ inputs.astro-tsconfig }}
      run: |
        if [[ -f astro.config.mjs ]]; then
          npx astro check ${TSCONFIG:+--tsconfig "$TSCONFIG"}
          npx svelte-check ${TSCONFIG:+--tsconfig "$TSCONFIG"}
        fi
    - if: inputs.coverage-lines == ''
      shell: bash
      run: npm test
    # `--experimental-test-coverage` не пускают ни в NODE_OPTIONS, ни после глоба тестов,
    # поэтому флаги встают сразу за `node` в скрипте `test`.
    - if: inputs.coverage-lines != ''
      shell: bash
      env:
        LINES: ${{ inputs.coverage-lines }}
      run: |
        script="$(node -p "require('./package.json').scripts.test ?? ''")"
        if [[ "$script" != node\ * ]]; then echo "coverage-lines needs a test script that starts with node: $script"; exit 1; fi
        eval "node --experimental-test-coverage --test-coverage-lines=$LINES \
          --test-coverage-exclude='**/*.test.ts' --test-coverage-exclude='**/*.e2e.ts' \
          --test-coverage-exclude='**/testing/**' --test-coverage-exclude='node_modules/**' ${script#node }"
    - shell: bash
      run: npm run build
    - if: inputs.ui == 'true'
      id: playwright
      shell: bash
      run: echo "version=$(node -p "require('playwright-core/package.json').version")" >> "$GITHUB_OUTPUT"
    - if: inputs.ui == 'true'
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
    - if: inputs.ui == 'true'
      shell: bash
      run: npx playwright install chromium
    # `--with-deps` тянул из apt шрифты, которых нет в образе раннера, и медленное зеркало
    # растягивало это до таймаута джобы. Библиотеки Chromium в образе уже есть, поэтому apt
    # нужен, только если браузер без них не стартует. Тогда ставим с лимитом и повтором:
    # apt докачивает начатое, следующая попытка продолжает с того же места.
    - if: inputs.ui == 'true'
      shell: bash
      run: |
        launch() { node -e "import('playwright-core').then(({ chromium }) => chromium.launch()).then((b) => b.close())"; }
        if launch; then exit 0; fi
        for attempt in 1 2 3; do
          if timeout 300 npx playwright install-deps chromium; then launch; exit; fi
          echo "::warning::Playwright system dependencies, attempt $attempt failed"
        done
        exit 1
    - if: inputs.ui == 'true'
      shell: bash
      run: npm run test:ui
    - if: inputs.smoke != ''
      shell: bash
      env:
        SMOKE: ${{ inputs.smoke }}
      run: eval "$SMOKE"
    # Пакет уходит в npm, а в репозитории рядом лежат devDependencies и build/:
    # смотрим на то, что получит человек, ставя тарбол в пустой каталог без них.
    - if: inputs.installed-smoke != ''
      shell: bash
      env:
        SMOKE: ${{ inputs.installed-smoke }}
      run: |
        tarball="$(npm pack --silent --pack-destination "$RUNNER_TEMP" | tail -n 1)"
        bin="$(node -p "Object.keys(require('./package.json').bin ?? {})[0] ?? ''")"
        dir="$RUNNER_TEMP/installed"
        mkdir -p "$dir"
        cd "$dir"
        npm init -y > /dev/null
        npm install --omit=dev --no-audit --no-fund "$RUNNER_TEMP/$tarball"
        if [[ "$SMOKE" == auto ]]; then
          if [[ -z "$bin" ]]; then echo "no bin in package.json, set installed-smoke"; exit 1; fi
          SMOKE="npx --no-install $bin --help"
        fi
        eval "$SMOKE"
    - if: inputs.installed-smoke == ''
      shell: bash
      run: npm pack --dry-run
    - if: inputs.docker != ''
      shell: bash
      env:
        DOCKERFILE: ${{ inputs.docker }}
      run: |
        docker build -f "$DOCKERFILE" -t mcp-check .
        docker run --rm mcp-check node build/index.js --help
