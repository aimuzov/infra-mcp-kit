name: Check

# На main эти проверки вызывает workflow релиза перед публикацией, а ветки
# проверяются через PR. Отдельный прогон на push дал бы дубль на тот же коммит.
on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      # Свой же action из этой ветки: так PR проверяет и изменения в нём.
      # У кита нет бинаря, вместо запуска сервера смотрим, что собранный пакет импортируется.
      - uses: ./check
        with:
          smoke: node -e "Promise.all(['@aimuzov/infra-mcp-kit', '@aimuzov/infra-mcp-kit/http', '@aimuzov/infra-mcp-kit/testing'].map((m) => import(m)))"
