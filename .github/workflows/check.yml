name: Check

# На main эти проверки вызывает workflow релиза перед публикацией, а ветки
# проверяются через PR. Отдельный прогон на push дал бы дубль на тот же коммит.
on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      # Свой же action из этой ветки: так PR проверяет и изменения в нём.
      # У кита нет бинаря, вместо запуска сервера смотрим, что установленный тарбол
      # импортируется. `--conditions=development` -- как у сервера, который гоняет
      # свои исходники: внутренние `#kit/*` не должны уводить его в `src`.
      - uses: ./check
        with:
          smoke: ''
          installed-smoke: node --conditions=development -e "Promise.all(['@aimuzov/infra-mcp-kit', '@aimuzov/infra-mcp-kit/http', '@aimuzov/infra-mcp-kit/testing'].map((m) => import(m)))"
      # Экраны UI в настоящем Chromium: CSP режет инлайн-код молча,
      # это видно только в консоли браузера. Браузер кэшируется по версии
      # Playwright, системные библиотеки ставятся из apt каждый прогон.
      # Снимки не сравниваем: шрифты на раннере другие.
      - id: playwright
        run: echo "version=$(npm ls playwright --json | jq -r '.dependencies.playwright.version')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
